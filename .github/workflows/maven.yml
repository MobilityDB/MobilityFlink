name: Maven CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The tree is checked before anything is built: the four rules read
  # `git ls-files` and nothing else, so a finding arrives in seconds rather than
  # after a libmeos build. The rules live in MEOS-API beside the catalog and the
  # provisioning recipe, so this repository carries no copy of them to go stale.
  hygiene:
    name: Tree hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Refuse tracked build output, skipped suites and stale pins
        uses: MobilityDB/MEOS-API/.github/actions/check-tree-hygiene@master

  # ── Linux ────────────────────────────────────────────────────────────────────
  linux:
    name: Build and test — Linux (Java 21 / Flink 2.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Derive the MEOS catalog (meos-idl.json via run.py) and build+install the
      # all-families libmeos.so from upstream MobilityDB master, through the shared
      # composite action (PG purge, apt.postgresql.org PG17, deps, cmake, install under
      # /usr/local). Tracking master (not a pinned commit) keeps the source, the catalog,
      # the JMEOS jar and the libmeos the smoke tests load all moving together, so the
      # generated facades can never drift from the surface they are built against.
      - name: Provision MEOS catalog + libmeos
        id: provision
        uses: MobilityDB/MEOS-API/.github/actions/provision-meos@master
        with:
          mobilitydb-ref: master
          build-libmeos: "true"

      - name: Stage the derived MEOS catalog
        # codegen_jvm.py reads tools/meos-idl.json; place the derived catalog there so its
        # wiring is unchanged. The catalog is gitignored — it only ever exists as a build artifact.
        run: |
          cp "${{ steps.provision.outputs.catalog-path }}" tools/meos-idl.json
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> "$GITHUB_ENV"

      - name: Check out JMEOS at master
        # Build the JMEOS jar (org.jmeos:meos:1.0) from JMEOS main against the SAME
        # master-derived catalog and libmeos, so the jar's FFI surface can never drift from the
        # surface the facade generator reads or the libmeos the smoke tests load.
        uses: actions/checkout@v4
        with:
          repository: MobilityDB/JMEOS
          ref: main
          path: jmeos

      - name: Stage the JVM generator JMEOS owns
        # codegen_jvm.py emits calls into the functions.GeneratedFunctions the jar below
        # carries, so JMEOS owns it and this repository holds no copy: a vendored one goes
        # stale the moment that surface folds an out-parameter or widens a return. Staged
        # beside the catalog and gitignored, exactly as the catalog is. codegen_spark_udfs.py
        # comes along because the spark arm loads it from the generator's own directory.
        run: cp jmeos/tools/codegen_jvm.py jmeos/tools/codegen_spark_udfs.py tools/

      - name: Build + install the JMEOS jar as org.jmeos:meos:1.0
        # JMEOS's own tools/regen-from-catalog.sh is the single runnable definition of this
        # build — it stages the catalog and libmeos, and jmeos-core's generate-sources emits
        # GeneratedFunctions from the catalog. tools/refresh-from-master.sh reaches it through
        # the same script, so the CI path and the by-hand path cannot drift. The jar plugin
        # writes the plain jar/JMEOS.jar (finalName JMEOS) — jnr-ffi is supplied by this
        # project's own pom, and libmeos is loaded from LD_LIBRARY_PATH, never from the jar —
        # installed under the org.jmeos:meos:1.0 coordinates the facade generator and the
        # processor consume. Naming LIBMEOS runs JMEOS's FFI suite against the libmeos this job
        # just built, which is what tells a jar that merely compiles from one whose generated
        # surface answers.
        run: |
          CATALOG="${{ steps.provision.outputs.catalog-path }}" \
          LIBMEOS=/usr/local/lib/libmeos.so \
            jmeos/tools/regen-from-catalog.sh
          mvn -B install:install-file \
            -Dfile=jmeos/jar/JMEOS.jar \
            -DgroupId=org.jmeos -DartifactId=meos -Dversion=1.0 -Dpackaging=jar

      - name: Build + generate + smoke tests
        # generate-sources runs codegen_jvm.py --engine flink over the installed jar's full surface;
        # the smoke tests exercise the facades against the freshly built libmeos from /usr/local/lib.
        run: mvn -B -Dmeos.lib.dir=/usr/local/lib -Dmeos.enabled=true clean test
